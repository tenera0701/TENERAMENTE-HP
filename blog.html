/* filters */
.blog-filters { position: sticky; top: var(--header-h); z-index: 20; background: rgba(244,242,237,.92); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.blog-filters .in { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 0 var(--gutter); max-width: var(--maxw); margin-inline: auto; }
.blog-filters .tabs { display: flex; gap: 0; overflow-x: auto; scrollbar-width: none; }
.blog-filters .tabs::-webkit-scrollbar { display: none; }
.blog-filters .tab { font-weight: 500; font-size: 13.5px; letter-spacing: .02em; padding: 16px 14px; color: var(--fg-2); position: relative; white-space: nowrap; transition: color .3s; }
.blog-filters .tab::after { content: ''; position: absolute; left: 14px; right: 14px; bottom: -1px; height: 2px; background: var(--fg); transform: scaleX(0); transform-origin: left; transition: transform .5s var(--ease); }
.blog-filters .tab:hover { color: var(--fg); }
.blog-filters .tab.active { color: var(--fg); }
.blog-filters .tab.active::after { transform: scaleX(1); }
.blog-filters .count { font-family: var(--font-mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--fg-3); white-space: nowrap; }

/* featured */
.featured { padding: clamp(36px, 5vw, 64px) 0 clamp(20px, 3vw, 40px); }
.featured-card { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: clamp(24px, 4vw, 64px); align-items: center; padding: clamp(24px, 3vw, 40px) 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.featured-tag { display: inline-flex; align-items: center; gap: 10px; font-family: var(--font-mono); font-size: 11.5px; font-weight: 500; letter-spacing: .16em; text-transform: uppercase; color: var(--fg-3); }
.featured-tag::before { content: ''; width: 6px; height: 6px; background: var(--accent); }
.featured-card h2 { font-weight: 700; font-size: clamp(24px, 3vw, 40px); line-height: 1.35; margin-top: 18px; letter-spacing: -.005em; }
.featured-card h2 a { transition: color .3s; }
.featured-card h2 a:hover { color: var(--ac); }
.featured-card .lead { margin-top: 18px; font-size: 15px; line-height: 1.9; max-width: 44em; }
.featured-card .meta { margin-top: 22px; display: flex; gap: 12px; align-items: center; font-family: var(--font-mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--fg-3); flex-wrap: wrap; }
.featured-card .meta .dot { width: 3px; height: 3px; background: var(--fg-3); }
.featured-visual { aspect-ratio: 1200 / 630; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; position: relative; background: var(--bg-2); display: grid; place-items: center; }
.featured-visual img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.featured-visual .glyph { font-family: var(--font-en); font-weight: 500; font-size: clamp(72px, 12vw, 160px); color: var(--fg-3); letter-spacing: -.04em; }
@media (max-width: 800px) { .featured-card { grid-template-columns: 1fr; gap: 20px; } .featured-visual { order: -1; } }

/* article grid */
.articles { padding: clamp(20px, 3vw, 40px) 0 clamp(56px, 7vw, 100px); }
.articles-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-top: 1px solid var(--line); border-left: 1px solid var(--line); }
.article-card { display: flex; flex-direction: column; gap: 12px; color: var(--fg); padding: clamp(18px, 2vw, 26px); border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); transition: background .4s var(--ease); }
.article-card:hover { background: var(--bg-2); }
.article-card:hover h3 { color: var(--ac); }
.article-card .visual { aspect-ratio: 1200 / 630; border: 1px solid var(--line); border-radius: 3px; position: relative; overflow: hidden; display: grid; place-items: center; background: var(--bg-2); }
.article-card .visual img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: transform 1.2s var(--ease); }
.article-card:hover .visual img { transform: scale(1.04); }
.article-card .visual .gl-text { font-family: var(--font-en); font-weight: 500; font-size: 56px; color: var(--fg-3); letter-spacing: -.04em; }
.article-card .meta-row { display: flex; gap: 10px; align-items: center; font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--fg-3); margin-top: 4px; flex-wrap: wrap; }
.article-card .meta-row .cat { color: var(--fg); }
.article-card .meta-row .dot { width: 3px; height: 3px; background: currentColor; }
.article-card h3 { font-weight: 700; font-size: 17px; line-height: 1.55; transition: color .3s; }
.article-card p { font-size: 13.5px; color: var(--fg-2); line-height: 1.8; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.article-card .read { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--fg-3); margin-top: auto; display: flex; align-items: center; gap: 8px; padding-top: 6px; }
.article-card .read::after { content: '→'; transition: transform .3s var(--ease); }
.article-card:hover .read::after { transform: translateX(3px); }
@media (max-width: 600px) { .blog-filters .count { display: none; } .blog-filters .tab { padding: 14px 10px; font-size: 13px; } }
@media (max-width: 900px) { .articles-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 600px) { .articles-grid { grid-template-columns: 1fr; } }
