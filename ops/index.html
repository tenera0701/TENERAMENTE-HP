<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<title>全セッション確認待ち一覧</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
  /* 黒い台紙に TENERAMENTE の青を1色だけ。印（種類・急ぎ）は意味の色として別に持つ */
  :root {
    color-scheme: dark;
    --bg: #0b0b0d; --panel: #141519; --line: #262833; --fg: #eceef4; --muted: #9a9fb2;
    --accent: #7d8fff; --accent-ink: #0a0d2b;
    --c-wait: #fbbf24; --c-prop: #7d8fff; --c-miss: #f87171; --c-mid: #5eead4; --c-done: #4ade80;
    --f-display: 'Dela Gothic One', 'Hiragino Sans', 'Yu Gothic', sans-serif;
    --f-body: 'Zen Kaku Gothic New', 'Hiragino Sans', 'Yu Gothic', Meiryo, sans-serif;
    --f-data: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body { background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 15px; line-height: 1.7; margin: 0; }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 36px 20px 80px; }
  a { color: var(--accent); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  [hidden] { display: none !important; }

  header.hero { display: grid; gap: 18px; padding-bottom: 28px; border-bottom: 1px solid var(--line); }
  .eyebrow { font-size: 12px; letter-spacing: .18em; color: var(--muted); }
  h1 { font-family: var(--f-display); font-weight: 400; font-size: clamp(30px, 7.4vw, 92px); line-height: 1.05; margin: 0; letter-spacing: .02em; }
  h1 em { font-style: normal; color: var(--accent); }
  .lead { color: var(--muted); margin: 0; }
  .lead b { color: var(--fg); }

  .score { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
  .score > button { text-align: left; font: inherit; color: inherit; border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; background: var(--panel); cursor: pointer; min-width: 0; }
  .score > button[aria-pressed="true"] { border-color: var(--accent); }
  .score .k { font-size: 12px; color: var(--muted); letter-spacing: .06em; }
  .score .v { font-family: var(--f-display); font-size: 46px; line-height: 1.05; font-variant-numeric: tabular-nums; }
  .score .v small { font-family: var(--f-body); font-size: 14px; color: var(--muted); margin-left: 4px; }

  .next { border: 1px solid var(--accent); border-radius: 14px; padding: 18px 20px; display: grid; gap: 10px; background: var(--panel); }
  .next-h { font-family: var(--f-display); font-weight: 400; font-size: clamp(24px, 4vw, 34px); margin: 0; color: var(--accent); }
  .next ol { margin: 0; padding: 0; list-style: none; display: grid; gap: 12px; counter-reset: nx; }
  .next li { display: grid; grid-template-columns: 34px 84px minmax(0, 1fr); gap: 12px; align-items: start; counter-increment: nx; }
  .next li::before { content: counter(nx); font-family: var(--f-display); font-size: 24px; line-height: 1.1; }
  .next b { display: block; font-size: 15.5px; }
  .next .why { color: var(--muted); font-size: 13.5px; display: block; }
  .next .where { font-size: 12.5px; }

  nav.jump { display: flex; flex-wrap: wrap; gap: 8px; }
  nav.jump a { text-decoration: none; color: var(--fg); border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; font-size: 13px; }
  nav.jump a:hover { border-color: var(--accent); color: var(--accent); }

  section { padding-top: 44px; }
  h2 { font-family: var(--f-display); font-weight: 400; font-size: clamp(28px, 5vw, 46px); margin: 0 0 6px; line-height: 1.15; }
  h2 .no { color: var(--accent); margin-right: 10px; }
  .sub { color: var(--muted); margin: 0 0 18px; max-width: 74ch; }

  .filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
  .filters .lab { font-size: 12px; color: var(--muted); margin-right: 2px; }
  .chip { font: inherit; font-size: 13px; color: var(--fg); background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 5px 13px; cursor: pointer; }
  .chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; }
  .count { margin-left: auto; font-family: var(--f-data); font-size: 12px; color: var(--muted); }

  .sess { border: 1px solid var(--line); border-radius: 12px; background: var(--panel); margin-bottom: 14px; overflow: hidden; }
  .sess-h { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 16px; padding: 14px 18px; border-bottom: 1px solid var(--line); }
  .sess-h h3 { margin: 0; font-size: 17px; line-height: 1.45; }
  .sess-h .meta { font-size: 12.5px; color: var(--muted); font-family: var(--f-data); }
  .sess-h .sum { grid-column: 1 / -1; margin: 0; font-size: 14px; color: var(--muted); }
  .sess-h .open { font-size: 12.5px; white-space: nowrap; align-self: start; }
  .state { font-size: 12px; border-radius: 999px; padding: 2px 10px; border: 1px solid var(--line); margin-left: 8px; vertical-align: 2px; white-space: nowrap; }
  .state.s-wait { border-color: var(--c-wait); color: var(--c-wait); }
  .state.s-run { border-color: var(--accent); color: var(--accent); }
  .state.s-stop { border-color: var(--c-miss); color: var(--c-miss); }
  .state.s-end { color: var(--muted); }

  .item { display: grid; grid-template-columns: 92px minmax(0, 1.2fr) minmax(0, 1fr); gap: 14px; padding: 13px 18px; border-bottom: 1px solid var(--line); align-items: start; }
  .item:last-child { border-bottom: 0; }
  .item.is-done { opacity: .55; }
  .type { font-size: 12px; font-weight: 700; border-radius: 6px; padding: 3px 0; text-align: center; border: 1px solid var(--line); display: block; }
  .t-wait { border-color: var(--c-wait); color: var(--c-wait); }
  .t-prop { border-color: var(--c-prop); color: var(--c-prop); }
  .t-miss { border-color: var(--c-miss); color: var(--c-miss); }
  .t-mid  { border-color: var(--c-mid);  color: var(--c-mid); }
  .urg { display: block; text-align: center; font-size: 11.5px; margin-top: 5px; color: var(--muted); }
  .urg.hi { color: #fecaca; font-weight: 700; }
  .item h4 { margin: 0 0 2px; font-size: 15px; }
  .item p { margin: 0; font-size: 14px; }
  .item .ev { font-size: 12.5px; color: var(--muted); margin-top: 4px; }
  .ask { font-size: 14px; }
  .ask .k { display: block; font-size: 11.5px; color: var(--muted); letter-spacing: .06em; }
  .now { display: inline-block; font-size: 11.5px; border-radius: 4px; padding: 0 7px; margin-top: 6px; border: 1px solid var(--line); color: var(--muted); }
  .now.left { border-color: var(--c-wait); color: var(--c-wait); }
  .now.done { border-color: var(--c-done); color: var(--c-done); }

  details.quiet { border: 1px solid var(--line); border-radius: 12px; padding: 12px 18px; margin-top: 14px; }
  details.quiet summary { cursor: pointer; color: var(--muted); }
  details.quiet ul { margin: 10px 0 0; padding-left: 1.1em; display: grid; gap: 4px; font-size: 13.5px; }
  details.quiet li span { color: var(--muted); }
  .empty { border: 1px dashed var(--line); border-radius: 12px; padding: 22px; color: var(--muted); }
  footer { margin-top: 48px; padding-top: 18px; border-top: 1px solid var(--line); color: var(--muted); font-size: 13px; display: grid; gap: 6px; max-width: 86ch; }

  .lock { min-height: 70vh; display: grid; place-content: center; gap: 14px; text-align: center; }
  .lock h1 { font-size: clamp(28px, 6vw, 56px); }
  .lock p { color: var(--muted); margin: 0; }

  @media (max-width: 760px) {
    .wrap { padding-inline: 16px; }
    .next li { grid-template-columns: 26px minmax(0, 1fr); }
    .next li .type { grid-column: 2; justify-self: start; padding: 2px 10px; }
    .next li > div { grid-column: 2; }
    .item { grid-template-columns: minmax(0, 1fr); gap: 6px; }
    .item .type { display: inline-block; padding: 2px 10px; }
    .urg { display: inline-block; margin: 0 0 0 8px; }
    .sess-h { grid-template-columns: minmax(0, 1fr); }
    .count { margin-left: 0; width: 100%; }
  }
</style>
</head>

    var arr = function (v) { return Array.isArray(v) ? v : []; };
    var TC = {'確認待ち': 't-wait', '提案未着手': 't-prop', '見落とし': 't-miss', '途中': 't-mid'};
    var SC = {'確認待ち': 's-wait', '進行中': 's-run', '動いている': 's-run', '途中で止まっている': 's-stop', '止まっている': 's-stop', '終わり': 's-end'};
    var TYPES = ['確認待ち', '提案未着手', '見落とし', '途中'];
    var st = {type: 'all', urg: 'all', area: 'all', hideDone: true};
    try { var sv = JSON.parse(localStorage.getItem('ops-board-f') || '{}'); if (sv && typeof sv === 'object') { for (var k in st) if (k in sv) st[k] = sv[k]; } } catch (e) {}
    function save() { try { localStorage.setItem('ops-board-f', JSON.stringify(st)); } catch (e) {} }

    var all = arr(D.sessions);
    var sched = arr(D.scheduled);
    var areas = []; all.forEach(function (s) { if (s.area && areas.indexOf(s.area) < 0) areas.push(s.area); });
    var allItems = []; all.concat(sched).forEach(function (s) { arr(s.items).forEach(function (it) { allItems.push(it); }); });
    var open = allItems.filter(function (it) { return it.now !== '済んだ'; });
    var cnt = {}; TYPES.forEach(function (t) { cnt[t] = open.filter(function (it) { return it.type === t; }).length; });

    var h = '';
    h += '<header class="hero"><div class="eyebrow">最終更新 ' + esc(D.updated_at) + '・読んだセッション ' + esc(D.read_count) + '件</div>';
    h += '<h1>全セッション<em>確認待ち</em></h1>';
    h += '<p class="lead">' + esc(D.lead) + '<br><b>確認待ち</b>＝社長の返事・ログイン・判断で止まっているもの／<b>提案未着手</b>＝Claude が出した案で返事が無いもの／<b>見落とし</b>＝「未確認」「未反映」のまま終わったもの／<b>途中</b>＝作業が止まっているもの。</p>';
    var nx = arr(D.next);
    if (nx.length) {
      h += '<div class="next"><h2 class="next-h">次にやること</h2><ol>' + nx.map(function (n) {
        return '<li><span class="type ' + (TC[n.type] || '') + '">' + esc(n.type) + '</span><div><b>' + esc(n.title) + '</b><span class="why">' + esc(n.why) + '</span>' +
          (n.session_id ? '<a class="where" href="#s-' + esc(n.session_id) + '">→ ' + esc(n.where || 'セッションへ') + '</a>' : (n.where ? '<span class="why">' + esc(n.where) + '</span>' : '')) + '</div></li>';
      }).join('') + '</ol></div>';
    }
    h += '<div class="score" id="score">' +
      '<button type="button" data-t="all"><div class="k">残っている件数</div><div class="v">' + open.length + '<small>件</small></div></button>' +
      TYPES.map(function (t) { return '<button type="button" data-t="' + t + '"><div class="k">' + t + '</div><div class="v" style="color:var(--' + {'確認待ち': 'c-wait', '提案未着手': 'c-prop', '見落とし': 'c-miss', '途中': 'c-mid'}[t] + ')">' + cnt[t] + '</div></button>'; }).join('') + '</div>';
    h += '<nav class="jump" aria-label="ページの中"><a href="#work">1. 作業のセッション</a><a href="#sched">2. 定期タスク</a><a href="#quiet">3. 片付いている・読めなかったセッション</a></nav></header>';

    h += '<section id="work"><h2><span class="no">1</span>作業のセッション</h2><p class="sub">社長が立ち上げたセッションごとに、残っていることを並べました。新しい順です。セッション名の右の「開く」で、そのセッションが開きます（パソコンの Claude アプリで開いたとき）。</p>';
    h += '<div class="filters" id="f-type"></div><div class="filters" id="f-urg"></div><div class="filters" id="f-area"></div><div class="filters" id="f-done"></div><div id="list"></div></section>';

    h += '<section id="sched"><h2><span class="no">2</span>定期タスク</h2><p class="sub">無人で回っている仕事の、最新の回の様子です。止まっている・頼みごとがあるものを上にしました。</p><div id="slist"></div></section>';

    var quiet = arr(D.quiet), unread = arr(D.unreadable);
    h += '<section id="quiet"><h2><span class="no">3</span>片付いている・読めなかったセッション</h2><p class="sub">読んだうえで残りが無かったセッションと、会話の記録が消えていて読めなかったセッションです。</p>';
    h += '<details class="quiet"><summary>残りが無かったセッション（' + quiet.length + '件）</summary><ul>' + quiet.map(function (q) { return '<li>' + esc(q.title) + ' <span>' + esc(q.last) + '・' + esc(q.summary) + '</span></li>'; }).join('') + '</ul></details>';
    h += '<details class="quiet"><summary>会話の記録が消えていて読めなかったセッション（' + unread.length + '件）</summary><ul>' + unread.map(function (q) { return '<li>' + esc(q.title) + ' <span>' + esc(q.last) + '</span></li>'; }).join('') + '</ul></details></section>';

    h += '<footer>' + arr(D.notes).map(function (n) { return '<div>' + esc(n) + '</div>'; }).join('') + '</footer>';
    document.getElementById('app').innerHTML = h;

    function chips(id, key, label, opts, withCount) {
      var box = document.getElementById(id);
      box.innerHTML = '<span class="lab">' + label + '</span>' + opts.map(function (o) {
        return '<button type="button" class="chip" data-v="' + esc(o[0]) + '" aria-pressed="' + (String(st[key]) === String(o[0])) + '">' + esc(o[1]) + '</button>';
      }).join('') + (withCount ? '<span class="count" id="count"></span>' : '');
      box.querySelectorAll('.chip').forEach(function (b) { b.addEventListener('click', function () {
        var v = b.dataset.v; st[key] = key === 'hideDone' ? v === 'true' : v; save(); draw(); }); });
    }
    function itemHTML(it) {
      var done = it.now === '済んだ';
      return '<div class="item' + (done ? ' is-done' : '') + '"><div><span class="type ' + (TC[it.type] || '') + '">' + esc(it.type) + '</span><span class="urg' + (it.urgency === '高' ? ' hi' : '') + '">急ぎ ' + esc(it.urgency || '—') + '</span></div>' +
        '<div><h4>' + esc(it.title) + '</h4><p>' + esc(it.detail) + '</p>' + (it.evidence ? '<div class="ev">根拠：' + esc(it.evidence) + '</div>' : '') + '</div>' +
        '<div class="ask"><span class="k">社長がやること</span>' + esc(it.ask) + '<br><span class="now ' + (done ? 'done' : (it.now === '残っている' ? 'left' : '')) + '">' + esc(it.now === '未確認' ? '今も残っているかは未確認' : it.now) + '</span></div></div>';
    }
    function pass(it) {
      if (st.hideDone && it.now === '済んだ') return false;
      if (st.type !== 'all' && it.type !== st.type) return false;
      if (st.urg === '高' && it.urgency !== '高') return false;
      return true;
    }
    function sessHTML(s, items) {
      return '<article class="sess" id="s-' + esc(s.session_id) + '"><div class="sess-h"><div><h3>' + esc(s.title) + '<span class="state ' + (SC[s.state] || '') + '">' + esc(s.state) + '</span></h3>' +
        '<div class="meta">' + esc(s.last) + '・' + esc(s.folder) + (s.runs ? '・' + esc(s.runs) + '回' : '') + '</div></div>' +
        (s.link ? '<a class="open" href="' + esc(s.link) + '">開く ↗</a>' : '<span></span>') +
        '<p class="sum">' + esc(s.summary) + '</p></div>' + items.map(itemHTML).join('') + '</article>';
    }
    function draw() {
      chips('f-type', 'type', '種類', [['all', 'すべて']].concat(TYPES.map(function (t) { return [t, t]; })), true);
      chips('f-urg', 'urg', '急ぎ', [['all', 'すべて'], ['高', '急ぎ 高だけ']]);
      chips('f-area', 'area', '分野', [['all', 'すべて']].concat(areas.map(function (a) { return [a, a]; })));
      chips('f-done', 'hideDone', '表示', [['true', '残っているものだけ'], ['false', '済んだものも出す']]);
      document.querySelectorAll('#score button').forEach(function (b) {
        b.setAttribute('aria-pressed', String(b.dataset.t === st.type));
        b.onclick = function () { st.type = b.dataset.t; save(); draw(); document.getElementById('work').scrollIntoView({behavior: 'smooth'}); };
      });
      var n = 0, out = '';
      all.forEach(function (s) {
        if (st.area !== 'all' && s.area !== st.area) return;
        var items = arr(s.items).filter(pass);
        if (!items.length) return;
        n += items.length; out += sessHTML(s, items);
      });
      document.getElementById('list').innerHTML = out || '<div class="empty">この絞り込みで残っているものはありません。</div>';
      document.getElementById('count').textContent = n + ' 件';
      var so = '';
      sched.forEach(function (s) { var items = arr(s.items).filter(function (it) { return !(st.hideDone && it.now === '済んだ'); }); so += sessHTML(s, items); });
      document.getElementById('slist').innerHTML = so || '<div class="empty">定期タスクの情報はありません。</div>';
    }
    draw();
  }
})();
</script>
</body>
</html>
