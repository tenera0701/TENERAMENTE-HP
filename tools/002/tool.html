<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>サロンブログメーカー</title>
<style>
:root{--ink:#16161a;--dim:#6b6b75;--line:#e3e3e8;--bg:#f6f6f8;--ac:#E5487A;--acl:#fdeef3;--ng:#e5322d;--ok:#1f9d55}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans JP","Yu Gothic",sans-serif;font-size:15px}
header{background:#111114;color:#fff;padding:16px 18px}
header h1{margin:0;font-size:20px;letter-spacing:.02em}
header p{margin:4px 0 0;color:#a9a9b3;font-size:12px}
main{padding:14px;max-width:760px;margin:0 auto}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card h2{margin:0 0 10px;font-size:15px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.f{display:block;margin-top:10px}
.f>span{display:block;font-size:13px;color:var(--dim);margin-bottom:4px}
input[type=text],input[type=date],select,textarea{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;width:100%}
textarea{resize:vertical;line-height:1.7}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{font:inherit;font-size:13px;padding:7px 11px;border-radius:999px;border:1px solid var(--line);background:#fff;cursor:pointer}
.chips button.on{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:700}
.btn{font:inherit;font-weight:700;border:none;border-radius:10px;padding:12px 16px;cursor:pointer}
.btn.main{background:var(--ac);color:#fff;width:100%;font-size:16px}
.btn.sub{background:#fff;border:1px solid var(--line)}
.btn.sm{padding:8px 12px;font-size:13px}
.photos{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.photos .ph{position:relative;width:76px;height:76px;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.photos img{width:100%;height:100%;object-fit:cover}
.photos .x{position:absolute;top:2px;right:2px;width:22px;height:22px;border-radius:50%;border:none;background:rgba(0,0,0,.6);color:#fff;font-size:13px;cursor:pointer}
.count{font-size:12px;color:var(--dim);text-align:right;margin-top:4px}
.hint{font-size:12px;color:var(--dim);margin:0 0 8px}
.ok{color:var(--ok);font-weight:700;font-size:13px;min-height:1em;margin-top:8px}
.list .it{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;border-top:1px solid var(--line);padding:10px 0}
.list .it:first-child{border-top:none}
.list .dt{font-weight:800;color:var(--ac);font-size:13px;white-space:nowrap}
.list .tt{font-size:14px}
.list .st{font-size:12px;color:var(--dim)}
.del{background:none;border:none;color:var(--dim);font-size:18px;cursor:pointer}
#out{display:none}
</style></head>
<body>
<header><h1>サロンブログメーカー</h1><p>テーマとメニューを選ぶと、ブログの題名と本文ができます。ネット不要・入れた内容はこのパソコンの中だけ</p></header>
<main>
  <div class="card">
    <h2>1. お店のこと（一度入れれば次から入っています）</h2>
    <label class="f"><span>お店の名前</span><input type="text" id="shop" placeholder="例）ヘアサロン ルミエ"></label>
    <label class="f"><span>書く人の名前</span><input type="text" id="writer" placeholder="例）スタイリストのあや"></label>
    <div class="f"><span>文の雰囲気</span><div class="chips" id="tones"></div></div>
    <label class="f"><span>毎回、最後に入れるひとこと（なくてもよい）</span><input type="text" id="sign" placeholder="例）駐車場は2台分あります"></label>
  </div>

  <div class="card">
    <h2>2. 今回のブログ</h2>
    <div class="f"><span>テーマ</span><div class="chips" id="themes"></div></div>
    <label class="f"><span id="menuLabel">メニューの名前</span><input type="text" id="menu"></label>
    <label class="f"><span>伝えたいこと（1行に1つ・3つくらい）</span><textarea id="points" rows="3"></textarea></label>
    <div class="f"><span>載せる写真</span>
      <label class="btn sub sm" style="display:inline-block">写真を選ぶ<input type="file" id="file" accept="image/*" multiple hidden></label>
      <div class="photos" id="photos"></div>
    </div>
  </div>

  <button class="btn main" id="make">題名と本文を作る</button>

  <div class="card" id="out" style="margin-top:12px">
    <h2>3. できた題名と本文（そのまま直せます）</h2>
    <label class="f"><span>題名</span><input type="text" id="title"></label>
    <div class="count" id="tCount"></div>
    <label class="f"><span>本文</span><textarea id="body" rows="14"></textarea></label>
    <div class="count" id="bCount"></div>
    <div class="row" style="margin-top:8px">
      <button class="btn sub sm" id="again">別の言い回しにする</button>
      <button class="btn sub sm" id="copyT">題名をコピー</button>
      <button class="btn sub sm" id="copyB">本文をコピー</button>
    </div>
    <div class="row" style="margin-top:12px">
      <label style="font-size:13px;color:var(--dim)">投稿する日 <input type="date" id="date" style="width:auto"></label>
      <button class="btn sub sm" id="save">下書きにためる</button>
    </div>
    <div class="ok" id="msg"></div>
  </div>

  <div class="card">
    <h2>4. ためた下書き</h2>
    <p class="hint">投稿する日の順に並びます。押すと中身を開きます</p>
    <div class="list" id="list"></div>
  </div>
</main>
<script>
const TONES = [["soft","やわらか"],["genki","元気"],["calm","落ち着き"]];
const THEMES = [
  ["new","新メニュー","メニューの名前","例）髪質改善トリートメント","例）\n髪のうねりが落ち着く\n1回でツヤが出る\nカラーと同じ日にできる"],
  ["season","季節のおすすめ","おすすめのメニュー","例）保湿ヘッドスパ","例）\n乾燥で広がる髪がまとまる\n頭皮のかゆみが落ち着く\n30分でできる"],
  ["care","お手入れのコツ","話題","例）髪の乾かし方","例）\n根元から先に乾かす\n上から下へ風を当てる\n最後に冷風でツヤを出す"],
  ["staff","スタッフ紹介","紹介する人","例）アシスタントのけん","例）\n得意なのはメンズのカット\n休みの日はキャンプ\nシャンプーが評判です"],
  ["open","空きのお知らせ","メニューや日にち","例）今週末のカット","例）\n土曜 10時・14時\n日曜 11時"]
];
const SEASON_TALK = ["寒い日が続きますね","まだまだ寒い日が続きますね","少しずつ暖かくなってきましたね","新しい季節が始まりましたね","過ごしやすい季節になりましたね","梅雨の時期になりましたね","暑い日が続いていますね","厳しい暑さが続いていますね","朝晩は少し涼しくなってきましたね","秋らしい気候になってきましたね","朝晩冷えるようになってきましたね","今年も残りわずかになりましたね"];
const SEASON = m => m<=1||m==11 ? {n:"冬",w:"乾燥"} : m<=4 ? {n:"春",w:"紫外線と季節の変わり目のゆらぎ"} : m<=7 ? {n:"夏",w:"紫外線と汗"} : {n:"秋",w:"夏に受けたダメージ"};

const KEY = "blogMaker.v1";
let st = load();
let photos = [];   // {id, src}
let seed = 0;
let cur = null;   // 開いている下書き（ためるときは上書き）

function load(){
  try{ const s = JSON.parse(localStorage.getItem(KEY)); if(s) return s; }catch(e){}
  return {shop:"", writer:"", tone:"soft", sign:"", theme:"new", menu:"", points:"", drafts:[]};
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(st)); }catch(e){} }
const $ = id => document.getElementById(id);
const pick = (a, n) => a[((n % a.length) + a.length) % a.length];

// ── 写真（下書きの写真はこのパソコンの中の IndexedDB に入れる） ──
const db = new Promise(res => {
  try{
    const r = indexedDB.open("blogMaker", 1);
    r.onupgradeneeded = () => r.result.createObjectStore("photos");
    r.onsuccess = () => res(r.result); r.onerror = () => res(null);
  }catch(e){ res(null); }
});
async function idb(mode, fn){
  const d = await db; if(!d) return null;
  return new Promise(res => { const t = d.transaction("photos", mode); const q = fn(t.objectStore("photos")); t.oncomplete = () => res(q && q.result); t.onerror = () => res(null); });
}
function shrink(file){
  return new Promise(res => {
    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, 1280 / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(img.src);
      res(c.toDataURL("image/jpeg", .86));
    };
    img.onerror = () => res(null);
    img.src = URL.createObjectURL(file);
  });
}
function drawPhotos(){
  $("photos").innerHTML = photos.map((p, i) => `<div class="ph"><img src="${p.src}" alt=""><button class="x" data-i="${i}" aria-label="外す">×</button></div>`).join("");
}
$("file").onchange = async e => {
  for(const f of e.target.files){ const s = await shrink(f); if(s) photos.push({id: Date.now() + "_" + photos.length, src: s}); }
  e.target.value = ""; drawPhotos();
};
$("photos").onclick = e => { if(e.target.dataset.i){ photos.splice(+e.target.dataset.i, 1); drawPhotos(); } };

// ── 画面 ──
function chips(el, list, cur, fn){
  el.innerHTML = list.map(([k, t]) => `<button data-k="${k}" class="${k == cur ? "on" : ""}">${t}</button>`).join("");
  el.onclick = e => { const k = e.target.dataset.k; if(k){ fn(k); } };
}
function drawForm(){
  $("shop").value = st.shop; $("writer").value = st.writer; $("sign").value = st.sign;
  chips($("tones"), TONES, st.tone, k => { st.tone = k; save(); drawForm(); if($("out").style.display == "block") make(); });
  chips($("themes"), THEMES.map(t => [t[0], t[1]]), st.theme, k => { st.theme = k; save(); drawForm(); });
  const th = THEMES.find(t => t[0] == st.theme);
  $("menuLabel").textContent = th[2]; $("menu").placeholder = th[3]; $("points").placeholder = th[4];
  $("menu").value = st.menu; $("points").value = st.points;
}
["shop","writer","sign","menu","points"].forEach(k => $(k).addEventListener("input", () => { st[k] = $(k).value; save(); }));

// ── 題名と本文を作る ──
function compose(){
  const now = new Date(), m = now.getMonth(), se = SEASON(m), n = seed;
  const shop = st.shop.trim() || "当店", wr = st.writer.trim();
  const menu = st.menu.trim() || "おすすめメニュー";
  const pts = st.points.split("\n").map(s => s.trim()).filter(Boolean);
  const tone = st.tone;
  const ex = tone == "genki" ? "！" : "。";
  const talk = SEASON_TALK[m];
  const who = wr ? `${shop}の${wr}です` : `${shop}です`;
  const hello = tone == "calm" ? `${who}。${talk}。` : `こんにちは${tone == "genki" ? "！" : "、"}${who}${ex}${talk}${ex}`;
  const list = pts.map(p => "・" + p).join("\n");
  const nums = pts.map((p, i) => "①②③④⑤⑥⑦⑧"[i] + " " + p).join("\n");
  let title, mid;
  switch(st.theme){
    case "new":
      title = pick([`【新メニュー】${menu}はじめました`, `${menu}が新しく登場しました`, `お待たせしました！${menu}スタート`], n);
      mid = pick([`このたび、新しく「${menu}」をはじめました${ex}`, `今日は、新しく始めた「${menu}」のご紹介です${ex}`], n)
        + (pts.length ? `\nおすすめのポイントは${pts.length}つです。\n\n${list}` : "")
        + `\n\n気になる方は、ご予約のときにメニューから「${menu}」をお選びください${ex}`;
      break;
    case "season":
      title = pick([`${se.n}のおすすめは${menu}`, `${se.n}こそ${menu}がおすすめです`, `${se.n}限定で人気の${menu}`], n);
      mid = `${se.n}は${se.w}が気になる季節。\nそこでおすすめなのが「${menu}」です${ex}`
        + (pts.length ? `\n\n${list}` : "")
        + `\n\n${pick(["季節に合わせたケアで、毎日をもっと心地よく過ごしましょう", "この時期だからこそ、一度ためしてみてください"], n)}${ex}`;
      break;
    case "care":
      title = pick([`おうちでできる${menu}のコツ`, `${menu}、ここを変えるだけで違います`, `プロが教える${menu}`], n);
      mid = `今日は、おうちでできる「${menu}」のコツをお伝えします${ex}`
        + (pts.length ? `\n\n${nums}` : "")
        + `\n\n${pick(["どれも今日からできることばかりです", "サロンでのケアと合わせて、ぜひためしてみてください"], n)}${ex}`
        + `\n分からないことは、ご来店のときに気軽に聞いてくださいね${ex}`;
      break;
    case "staff":
      title = pick([`スタッフ紹介｜${menu}`, `${menu}をご紹介します`, `新しい仲間、${menu}です`], n);
      mid = `今日は、${menu}を紹介します${ex}`
        + (pts.length ? `\n\n${list}` : "")
        + `\n\n${pick(["ご指名もお待ちしています", "ご来店のときは、ぜひ声をかけてください"], n)}${ex}`;
      break;
    default:
      title = pick([`【空きあり】${menu}のご案内`, `${menu}、まだご予約できます`, `${menu}の空き状況のお知らせ`], n);
      mid = `${menu}のご予約に、まだ空きがあります${ex}`
        + (pts.length ? `\n\n${list}` : "")
        + `\n\n${pick(["ご予約はお早めにどうぞ", "埋まりやすい時間なので、気になる方はお早めに"], n)}${ex}`;
  }
  const close = {
    soft: pick(["ご予約は、ホットペッパービューティーからお待ちしております。\n皆さまのご来店を、スタッフ一同心よりお待ちしております。", "ご予約はホットペッパービューティーから受け付けています。\nお会いできるのを楽しみにしています。"], n),
    genki: pick(["ご予約はホットペッパービューティーから！\nお会いできるのを楽しみにしています！", "ご予約はホットペッパービューティーからどうぞ！\nスタッフ一同お待ちしています！"], n),
    calm: pick(["ご予約は、ホットペッパービューティーより承っております。\nご来店をお待ちしております。", "ご予約はホットペッパービューティーからお願いいたします。\nお待ちしております。"], n)
  }[tone];
  const sign = st.sign.trim() ? `\n\n${st.sign.trim()}` : "";
  return {title, body: `${hello}\n\n${mid}\n\n${close}${sign}`};
}
function counts(){
  $("tCount").textContent = `題名 ${[...$("title").value].length}文字`;
  $("bCount").textContent = `本文 ${[...$("body").value].length}文字・写真 ${photos.length}枚`;
}
function make(){
  const r = compose();
  $("title").value = r.title; $("body").value = r.body;
  $("out").style.display = "block"; $("msg").textContent = ""; counts();
  if(!$("date").value) $("date").value = nextDay();
}
$("make").onclick = () => { cur = null; $("date").value = ""; make(); $("out").scrollIntoView({behavior: "smooth", block: "start"}); };
$("again").onclick = () => { seed++; make(); };
$("title").oninput = counts; $("body").oninput = counts;
async function copy(t, what){
  const a = document.createElement("textarea"); a.value = t; document.body.appendChild(a); a.select();
  let ok = false; try{ ok = document.execCommand("copy"); }catch(e){}
  a.remove();
  if(!ok){ try{ await navigator.clipboard.writeText(t); ok = true; }catch(e){} }
  $("msg").textContent = ok ? `${what}をコピーしました` : "コピーできませんでした。文を選んでコピーしてください";
}
$("copyT").onclick = () => copy($("title").value, "題名");
$("copyB").onclick = () => copy($("body").value, "本文");

// ── 下書き ──
function nextDay(){ const d = new Date(); d.setDate(d.getDate() + 1); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; }
$("save").onclick = async () => {
  const date = $("date").value || nextDay();
  const old = cur && st.drafts.find(d => d.id == cur);
  const id = old ? old.id : "d" + Date.now();
  const rec = {id, date, title: $("title").value, body: $("body").value, theme: old ? old.theme : st.theme, photos: photos.length, posted: old ? old.posted : false};
  if(old) Object.assign(old, rec); else st.drafts.push(rec);
  cur = id;
  st.drafts.sort((a, b) => a.date.localeCompare(b.date)); save();
  await idb("readwrite", s => s.put(photos.map(p => p.src), id));
  $("msg").textContent = `${date.slice(5).replace("-", "/")} の下書きにためました`;
  drawList();
};
function drawList(){
  if(!st.drafts.length){ $("list").innerHTML = `<p class="hint" style="margin:0">まだありません</p>`; return; }
  $("list").innerHTML = st.drafts.map(d => `<div class="it" data-id="${d.id}"><span class="dt">${d.date.slice(5).replace("-", "/")}</span>`
    + `<span><div class="tt">${esc(d.title)}</div><div class="st">${THEMES.find(t => t[0] == d.theme)[1]}・写真${d.photos}枚</div></span>`
    + `<button class="del" data-del="${d.id}" aria-label="消す">×</button></div>`).join("");
}
function esc(s){ return s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
$("list").onclick = async e => {
  const del = e.target.dataset.del;
  if(del){ if(cur == del) cur = null; st.drafts = st.drafts.filter(d => d.id != del); save(); await idb("readwrite", s => s.delete(del)); drawList(); return; }
  const it = e.target.closest(".it"); if(!it) return;
  const d = st.drafts.find(x => x.id == it.dataset.id);
  cur = d.id;
  $("title").value = d.title; $("body").value = d.body; $("date").value = d.date;
  const srcs = await idb("readonly", s => s.get(d.id)) || [];
  photos = srcs.map((src, i) => ({id: d.id + "_" + i, src})); drawPhotos();
  $("out").style.display = "block"; $("msg").textContent = "下書きを開きました"; counts();
  $("out").scrollIntoView({behavior: "smooth", block: "start"});
};

drawForm(); drawList();
</script>
</body></html>
