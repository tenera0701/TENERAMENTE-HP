<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>シフト表メーカー</title>
<style>
:root{--ink:#16161a;--dim:#6b6b75;--line:#e3e3e8;--bg:#f6f6f8;--ac:#2340F5;--ng:#e5322d;--ok:#1f9d55}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans JP","Yu Gothic",sans-serif;font-size:15px}
header{background:#111114;color:#fff;padding:16px 18px}
header h1{margin:0;font-size:20px;letter-spacing:.02em}
header p{margin:4px 0 0;color:#a9a9b3;font-size:12px}
main{padding:14px;max-width:980px;margin:0 auto}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card h2{margin:0 0 10px;font-size:15px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
label{font-size:13px;color:var(--dim)}
input[type=number],input[type=month],input[type=text],input[type=time]{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff}
input[type=number]{width:64px}
input[type=time]{padding:6px 6px;font-size:14px}
.staff{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;border-top:1px solid var(--line);padding:10px 0}
.staff:first-of-type{border-top:none}
.staff .nm{font-weight:700}
.time{display:flex;gap:6px;align-items:center;margin-top:6px;font-size:13px;color:var(--dim)}
.days{display:flex;gap:4px;margin-top:6px}
.days button{width:34px;height:30px;border-radius:8px;border:1px solid var(--line);background:#fff;font:inherit;font-size:13px;cursor:pointer}
.days button.off{background:#ffe9e8;border-color:#f3b4b1;color:var(--ng);text-decoration:line-through}
.max{font-size:12px;color:var(--dim);margin-top:6px}
.btn{font:inherit;font-weight:700;border:none;border-radius:10px;padding:12px 16px;cursor:pointer}
.btn.main{background:var(--ac);color:#fff;width:100%;font-size:16px}
.btn.sub{background:#fff;border:1px solid var(--line)}
.btn.ng{background:#fff;border:1px solid #f3b4b1;color:var(--ng)}
.del{background:none;border:none;color:var(--dim);font-size:18px;cursor:pointer}
table{border-collapse:collapse;width:100%;font-size:12px}
th,td{border:1px solid var(--line);padding:4px 2px;text-align:center}
th{background:#fafafc;font-weight:700}
td.on{color:var(--ac);font-weight:800;white-space:nowrap;font-size:11px}
td.cell{cursor:pointer}
td.cell:hover{background:#f1f2ff}
tr.short td.d{background:#ffe9e8;color:var(--ng);font-weight:900}
td.sat{color:#2f6bd8} td.sun{color:var(--ng)}
.sum{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.sum span{background:#f1f2ff;border-radius:999px;padding:6px 10px;font-size:13px}
.hint{font-size:12px;color:var(--dim);margin:0 0 8px}
.alert{color:var(--ng);font-weight:700;margin-top:8px}
.ok{color:var(--ok);font-weight:700;margin-top:8px}
.tablewrap{overflow-x:auto}
#editor{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);box-shadow:0 -8px 30px rgba(0,0,0,.12);padding:16px 18px 20px;display:none}
#editor h3{margin:0 0 10px;font-size:16px}
#editor .row{margin-top:10px}
@media print{header,.card.input,.noprint,#editor{display:none!important}body{background:#fff}.card{border:none}}
</style></head>
<body>
<header><h1>シフト表メーカー</h1><p>スタッフの時間と出られない曜日を入れて、ボタンを押すだけ。ネット不要・入れた内容はこのパソコンの中だけ</p></header>
<main>
  <div class="card input">
    <h2>1. 月と、1日に必要な人数</h2>
    <div class="row">
      <input type="month" id="month">
      <label>平日 <input type="number" id="needW" min="0" value="2"> 人</label>
      <label>土日 <input type="number" id="needH" min="0" value="3"> 人</label>
    </div>
  </div>
  <div class="card input">
    <h2>2. スタッフ（出勤・退勤の時間と、出られない曜日）</h2>
    <div id="staffList"></div>
    <div class="row" style="margin-top:8px">
      <input type="text" id="newName" placeholder="名前を追加">
      <button class="btn sub" id="add">追加</button>
    </div>
  </div>
  <button class="btn main noprint" id="make">シフトを自動で作る</button>
  <div class="card" id="result" style="margin-top:12px;display:none">
    <h2 id="resTitle">シフト表</h2>
    <p class="hint noprint">マスを押すと、その日の時間を直したり、休みにしたりできます</p>
    <div class="tablewrap"><table id="table"></table></div>
    <div class="sum" id="sum"></div>
    <div id="msg"></div>
    <div class="row noprint" style="margin-top:10px">
      <button class="btn sub" id="print">印刷する</button>
      <button class="btn sub" id="csv">CSVで保存</button>
    </div>
  </div>
</main>
<div id="editor">
  <h3 id="edTitle"></h3>
  <div class="time">出勤 <input type="time" id="edS" step="900"> 〜 退勤 <input type="time" id="edE" step="900"></div>
  <div class="row">
    <button class="btn main" id="edSave" style="width:auto;flex:1">この時間にする</button>
    <button class="btn ng" id="edOff">休みにする</button>
    <button class="btn sub" id="edClose">閉じる</button>
  </div>
</div>
<script>
const W = ["日", "月", "火", "水", "木", "金", "土"];
const KEY = "shift-maker-v1";
// 例のスタッフ（架空の名前）。最初に開いたときだけ入る
let state = load() || {
  staff: [
    {name: "あや", off: [0], max: 4, s: "10:00", e: "18:00"}, {name: "けん", off: [3], max: 5, s: "13:00", e: "22:00"},
    {name: "みき", off: [6, 0], max: 3, s: "09:00", e: "15:00"}, {name: "ゆう", off: [], max: 4, s: "10:00", e: "19:00"},
    {name: "さき", off: [1, 2], max: 3, s: "17:00", e: "22:00"}
  ]
};
state.staff.forEach(s => { s.s = s.s || "10:00"; s.e = s.e || "18:00"; });   // 時間がない前の版のデータにも入れる
function load() { try { return JSON.parse(localStorage.getItem(KEY)); } catch (e) { return null; } }
function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }
const $ = id => document.getElementById(id);
const now = new Date(); now.setMonth(now.getMonth() + 1);
$("month").value = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}`;

const toMin = t => { const [h, m] = t.split(":").map(Number); return h * 60 + m; };
// 退勤が出勤より前なら日をまたいだとみなす（22時〜翌2時など）
const hours = (s, e) => { let a = toMin(s), b = toMin(e); if (b <= a) b += 1440; return (b - a) / 60; };
const short = t => t.endsWith(":00") ? String(+t.slice(0, 2)) : `${+t.slice(0, 2)}:${t.slice(3)}`;
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));

function drawStaff() {
  $("staffList").innerHTML = state.staff.map((s, i) => `
    <div class="staff"><div><div class="nm">${esc(s.name)}</div>
      <div class="time">出勤 <input type="time" step="900" value="${s.s}" data-s="${i}"> 〜 退勤 <input type="time" step="900" value="${s.e}" data-e="${i}"></div>
      <div class="days">${W.map((w, d) => `<button data-i="${i}" data-d="${d}" class="${s.off.includes(d) ? "off" : ""}">${w}</button>`).join("")}</div>
      <div class="max">週に <input type="number" min="1" max="7" value="${s.max}" data-max="${i}" style="width:52px"> 日まで</div></div>
      <button class="del" data-del="${i}" title="消す">×</button></div>`).join("");
}
$("staffList").addEventListener("click", e => {
  const b = e.target;
  if (b.dataset.d !== undefined) {
    const s = state.staff[+b.dataset.i], d = +b.dataset.d;
    s.off = s.off.includes(d) ? s.off.filter(x => x !== d) : [...s.off, d];
  } else if (b.dataset.del !== undefined) state.staff.splice(+b.dataset.del, 1);
  else return;
  save(); drawStaff();
});
$("staffList").addEventListener("change", e => {
  const t = e.target;
  if (t.dataset.max !== undefined) state.staff[+t.dataset.max].max = Math.max(1, +t.value || 1);
  else if (t.dataset.s !== undefined && t.value) state.staff[+t.dataset.s].s = t.value;
  else if (t.dataset.e !== undefined && t.value) state.staff[+t.dataset.e].e = t.value;
  else return;
  save();
});
$("add").onclick = () => {
  const n = $("newName").value.trim(); if (!n) return;
  state.staff.push({name: n, off: [], max: 4, s: "10:00", e: "18:00"}); $("newName").value = ""; save(); drawStaff();
};

// 割り振り：その日に出られる人のうち、今月まだ少ない人から順に入れる。週の上限は超えない
function makeShift() {
  const [y, m] = $("month").value.split("-").map(Number);
  const days = new Date(y, m, 0).getDate();
  const needW = +$("needW").value || 0, needH = +$("needH").value || 0;
  const total = state.staff.map(() => 0), plan = [];
  let week = state.staff.map(() => 0);
  for (let d = 1; d <= days; d++) {
    const wd = new Date(y, m - 1, d).getDay();
    if (wd === 1) week = state.staff.map(() => 0);           // 月曜で週の回数をリセット
    const need = (wd === 0 || wd === 6) ? needH : needW;
    const can = state.staff.map((s, i) => i).filter(i => !state.staff[i].off.includes(wd) && week[i] < state.staff[i].max);
    can.sort((a, b) => total[a] - total[b] || week[a] - week[b]);
    const work = {};                                           // スタッフの番号 → その日の出勤・退勤
    can.slice(0, need).forEach(i => { total[i]++; week[i]++; work[i] = {s: state.staff[i].s, e: state.staff[i].e}; });
    plan.push({d, wd, need, work});
  }
  return {y, m, plan, names: state.staff.map(s => s.name)};
}
let last = null, editing = null;
// 日数・時間・足りない日は、マスを直すたびに数え直す
function totals(r) {
  const days = r.names.map(() => 0), hrs = r.names.map(() => 0);
  let shortDays = 0;
  r.plan.forEach(p => {
    Object.entries(p.work).forEach(([i, w]) => { days[i]++; hrs[i] += hours(w.s, w.e); });
    if (Object.keys(p.work).length < p.need) shortDays++;
  });
  return {days, hrs, shortDays};
}
function drawResult(r) {
  last = r;
  const t = totals(r);
  $("result").style.display = "block";
  $("resTitle").textContent = `${r.y}年${r.m}月のシフト表`;
  const head = `<tr><th>日</th><th>曜</th>${r.names.map(n => `<th>${esc(n)}</th>`).join("")}<th>人数</th></tr>`;
  const rows = r.plan.map((p, k) => {
    const cls = p.wd === 0 ? "sun" : p.wd === 6 ? "sat" : "";
    const n = Object.keys(p.work).length;
    return `<tr class="${n < p.need ? "short" : ""}"><td class="d ${cls}">${p.d}</td><td class="${cls}">${W[p.wd]}</td>
      ${r.names.map((_, i) => p.work[i] ? `<td class="cell on" data-k="${k}" data-i="${i}">${short(p.work[i].s)}-${short(p.work[i].e)}</td>`
                                        : `<td class="cell" data-k="${k}" data-i="${i}"></td>`).join("")}
      <td class="d">${n}/${p.need}</td></tr>`;
  }).join("");
  $("table").innerHTML = head + rows;
  $("sum").innerHTML = r.names.map((n, i) => `<span>${esc(n)} ${t.days[i]}日・${+t.hrs[i].toFixed(2)}時間</span>`).join("");
  $("msg").innerHTML = t.shortDays ? `<div class="alert">人が足りない日が ${t.shortDays} 日あります（赤い行）</div>`
                                   : `<div class="ok">全部の日がそろいました</div>`;
}
$("make").onclick = () => { closeEditor(); drawResult(makeShift()); $("result").scrollIntoView({behavior: "smooth"}); };

// マスを押すと下から時間の入れ物が出る
$("table").addEventListener("click", e => {
  const td = e.target.closest("td.cell"); if (!td || !last) return;
  const k = +td.dataset.k, i = +td.dataset.i, p = last.plan[k];
  const w = p.work[i] || {s: (state.staff[i] || {}).s || "10:00", e: (state.staff[i] || {}).e || "18:00"};
  editing = {k, i};
  $("edTitle").textContent = `${last.m}月${p.d}日（${W[p.wd]}） ${last.names[i]}`;
  $("edS").value = w.s; $("edE").value = w.e;
  $("edSave").textContent = p.work[i] ? "この時間にする" : "出勤にする";
  $("edOff").style.display = p.work[i] ? "" : "none";
  $("editor").style.display = "block";
});
function closeEditor() { editing = null; $("editor").style.display = "none"; }
$("edClose").onclick = closeEditor;
$("edSave").onclick = () => {
  if (!editing || !$("edS").value || !$("edE").value) return;
  last.plan[editing.k].work[editing.i] = {s: $("edS").value, e: $("edE").value};
  closeEditor(); drawResult(last);
};
$("edOff").onclick = () => {
  if (!editing) return;
  delete last.plan[editing.k].work[editing.i];
  closeEditor(); drawResult(last);
};
$("print").onclick = () => { closeEditor(); window.print(); };
$("csv").onclick = () => {
  if (!last) return;
  const t = totals(last);
  const q = v => /[",\n]/.test(String(v)) ? `"${String(v).replace(/"/g, '""')}"` : v;
  const lines = [["日", "曜", ...last.names.map(q), "人数"].join(",")];
  last.plan.forEach(p => lines.push([p.d, W[p.wd], ...last.names.map((_, i) => p.work[i] ? `${p.work[i].s}-${p.work[i].e}` : ""),
                                     `${Object.keys(p.work).length}/${p.need}`].join(",")));
  lines.push(["出勤日数", "", ...t.days].join(","));
  lines.push(["合計時間", "", ...t.hrs.map(h => +h.toFixed(2))].join(","));
  const blob = new Blob(["﻿" + lines.join("\n")], {type: "text/csv"});
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `シフト_${last.y}-${last.m}.csv`; a.click();
};
drawStaff();
</script>
</body></html>
