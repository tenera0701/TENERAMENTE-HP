name: ミルページのブログを取り込む

# ミルページ（自社CMS）で公開した記事を posts/*.md に取り込み、
# サイト（posts.json・記事ページ・sitemap）を再生成してコミットする。
# 記事の見た目・URL・SEO の仕組みは今までのまま。

on:
  schedule:
    # 毎日 07:05 と 19:05（日本時間）。ミルページの予約投稿・AI自動投稿を拾う。
    - cron: '5 22 * * *'
    - cron: '5 10 * * *'
  workflow_dispatch:        # 「今すぐ反映したい」ときは Actions 画面から手動実行できる

permissions:
  contents: write

concurrency:
  group: sync-milpage
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: ミルページから取り込んでサイトを再生成
        env:
          # 店舗IDは data/milpage.json に入れてあるが、リポジトリに置きたくない場合は
          # リポジトリの Settings → Secrets and variables → Actions で MILPAGE_STORE を設定すると
          # そちらが優先される。
          MILPAGE_STORE: ${{ vars.MILPAGE_STORE || secrets.MILPAGE_STORE }}
        run: node scripts/sync-milpage.js --build

      - name: 変更があればコミットして公開
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "変更はありません"
            exit 0
          fi
          git config user.name  "milpage-sync"
          git config user.email "milpage-sync@users.noreply.github.com"
          git add -A
          git commit -m "ミルページの記事を反映（自動）"
          git push
