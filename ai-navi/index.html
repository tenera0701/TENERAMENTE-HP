<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI導入ナビ｜TENERAMENTE</title>
<meta name="description" content="AIを仕事で使い始めるための7ステップ。使うAIの選び方、守るルール、コピペで使える指示文、仕事の書き出しと減る時間の計算まで、画面の順に進めるだけです。">
<link rel="canonical" href="https://teneramente.jp/ai-navi/">
<meta property="og:title" content="AI導入ナビ｜TENERAMENTE">
<meta property="og:description" content="AIを仕事で使い始めるための7ステップ。使うAIの選び方、守るルール、コピペで使える指示文、仕事の書き出しと減る時間の計算まで、画面の順に進めるだけです。">
<meta property="og:type" content="website">
<meta property="og:url" content="https://teneramente.jp/ai-navi/">
<meta property="og:site_name" content="TENERAMENTE">
<link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml">
<link rel="icon" href="../assets/img/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="../assets/img/favicon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap"></noscript>
<script>window.NAVI_CLIENT_ONLY=true;</script>
<style>
/* レイアウト: 黒い作業台に、黄色の「進め」の信号を1色だけ。巨大な見出し → 左に工程表、右に作業面 */
:root{
  --bg:#0c0c0e;
  --surface:#16161a;
  --surface-2:#1f1f25;
  --line:#2e2e36;
  --fg:#f3f1ea;
  --mute:#a6a4ad;
  --accent:#ffd23f;
  --accent-ink:#17140a;
  --accent-soft:rgba(255,210,63,.13);
  --ok:#45d49f;
  --ok-soft:rgba(69,212,159,.13);
  --ng:#ff6b5e;
  --ng-soft:rgba(255,107,94,.13);
  --f-display:"Dela Gothic One","Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",sans-serif;
  --f-num:"Archivo","Helvetica Neue",Arial,sans-serif;
  --r:14px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-padding-top:120px}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.8;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg)}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.nb{display:inline-block}

/* 上の帯 */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:rgba(12,12,14,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;justify-content:space-between;gap:12px 20px;flex-wrap:wrap;padding-block:12px}
.brand{font-family:var(--f-display);font-size:20px;color:var(--fg);text-decoration:none;letter-spacing:.02em;display:flex;align-items:center;gap:10px}
.brand i{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.modes{display:flex;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px}
.modes a{display:block;padding:7px 16px;border-radius:999px;color:var(--mute);text-decoration:none;font-weight:700;font-size:14px;white-space:nowrap}
.modes a[aria-current="page"]{background:var(--accent);color:var(--accent-ink)}
@media (max-width:560px){.modes{width:100%}.modes a{flex:1;text-align:center;padding:7px 8px}}

/* 見出しの帯 */
.hero{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:32px;align-items:end;padding-block:56px 36px}
.eyebrow{margin:0 0 14px;font-weight:700;font-size:14px;letter-spacing:.14em;color:var(--accent)}
.hero h1{margin:0;font-family:var(--f-display);font-weight:400;font-size:clamp(40px,7.2vw,96px);line-height:1.1;letter-spacing:-.01em}
.hero h1 em{font-style:normal;color:var(--accent)}
.lead{margin:22px 0 0;max-width:40em;color:var(--mute);font-size:17px}
.lead b{color:var(--fg)}
.goal{border:1px solid var(--line);border-radius:var(--r);padding:22px 24px;background:var(--surface)}
.goal-label{margin:0;font-weight:700;font-size:13px;letter-spacing:.14em;color:var(--mute)}
.goal-num{margin:4px 0 6px;display:flex;align-items:baseline;gap:8px;line-height:1}
.goal-num small{font-family:var(--f-body);font-weight:700;font-size:18px}
.goal-num b{font-family:var(--f-num);font-weight:800;font-size:96px;color:var(--accent);letter-spacing:-.04em}
.goal p{margin:6px 0 0}
.note{font-size:13px;color:var(--mute)}
@media (max-width:900px){.hero{grid-template-columns:minmax(0,1fr);padding-block:36px 24px}}

/* 業種とAIの選択 */
.setup{display:flex;flex-wrap:wrap;gap:14px 36px;padding-block:18px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.setup-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;min-width:0}
.setup-label{font-weight:700;font-size:13px;letter-spacing:.12em;color:var(--mute)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-weight:700;font-size:14px;cursor:pointer;color:var(--fg)}
.chip:hover{border-color:var(--mute)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

/* 作業エリア */
.work{display:grid;grid-template-columns:270px minmax(0,1fr);gap:28px;align-items:start;padding-block:28px 64px}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);min-width:0}
.progress{margin:0 0 14px}
.progress-top{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:var(--mute);font-weight:700}
.progress-top .num{font-size:22px;color:var(--fg)}
.bar{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin-top:6px}
.bar span{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.stepper{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;position:relative}
.stepper button{width:100%;display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px;align-items:center;text-align:left;background:transparent;border:1px solid transparent;border-radius:12px;padding:9px 10px;cursor:pointer;color:var(--mute)}
.stepper button:hover{background:var(--surface)}
.stepper .sn{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-num);font-weight:800;font-size:14px;border:1px solid var(--line);color:var(--mute)}
.stepper .st{font-weight:700;font-size:15px;line-height:1.4}
.stepper .tm{font-size:12px;color:var(--mute)}
.stepper .ck{font-size:13px;font-weight:700;color:var(--ok);min-width:3em;text-align:right}
.stepper button[aria-current="step"]{background:var(--surface);border-color:var(--line);color:var(--fg)}
.stepper button[aria-current="step"] .sn{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.stepper button.is-done .sn{border-color:var(--ok);color:var(--ok)}
@media (max-width:900px){
  .work{grid-template-columns:minmax(0,1fr);gap:18px;padding-block:20px 48px}
  .side{position:static}
  .stepper{flex-direction:row;overflow-x:auto;padding-bottom:6px;gap:6px;scrollbar-width:thin}
  .stepper li{flex:0 0 auto}
  .stepper button{grid-template-columns:30px auto;width:auto;padding:7px 12px 7px 8px;border-color:var(--line)}
  .stepper .tm,.stepper .ck{display:none}
  .stepper .st{font-size:14px;white-space:nowrap}
}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:32px clamp(18px,3.4vw,40px) 28px;min-width:0;container-type:inline-size;container-name:panel}
.panel-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px;margin-bottom:6px}
.panel-step{font-family:var(--f-num);font-weight:800;font-size:14px;letter-spacing:.12em;color:var(--accent)}
.panel-time{font-size:13px;color:var(--mute)}
.panel-done{font-size:13px;font-weight:700;color:var(--ok);border:1px solid var(--ok);border-radius:999px;padding:1px 10px}
.panel h2{margin:0 0 12px;font-family:var(--f-display);font-weight:400;font-size:clamp(28px,3.6vw,44px);line-height:1.25;text-wrap:balance}
.panel h3{margin:34px 0 12px;font-size:19px;line-height:1.5}
:where(.panel) p{margin:0 0 12px}
.intro{color:var(--mute);max-width:44em}
.intro b{color:var(--fg)}
.panel-foot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;margin-top:36px;padding-top:22px;border-top:1px solid var(--line)}

/* ボタン */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;padding:10px 20px;font-weight:700;font-size:15px;cursor:pointer;border:1px solid var(--line);background:transparent;color:var(--fg);text-decoration:none;line-height:1.4}
.btn:hover{border-color:var(--mute)}
.btn-main{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-main:hover{filter:brightness(1.06);border-color:var(--accent)}
.btn-sm{padding:6px 14px;font-size:13px}
.btn-danger{border-color:var(--ng);color:var(--ng)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;gap:3px;background:var(--bg)}
.seg button{border:0;background:transparent;border-radius:999px;padding:6px 16px;font-weight:700;cursor:pointer;color:var(--mute)}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}

/* ステップ1: レベル */
.qlist{display:flex;flex-direction:column;gap:8px;margin:18px 0}
.q{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 16px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--bg)}
.q-text{display:flex;gap:12px;align-items:baseline}
.q-text .num{color:var(--mute);font-weight:700;font-size:13px}
.yn{display:flex;gap:6px}
.yn button{border:1px solid var(--line);background:transparent;border-radius:999px;padding:5px 16px;font-weight:700;cursor:pointer;color:var(--mute);min-width:64px}
.yn button[aria-pressed="true"].yes{background:var(--ok);border-color:var(--ok);color:#06150f}
.yn button[aria-pressed="true"].no{background:var(--surface-2);border-color:var(--mute);color:var(--fg)}
@media (max-width:560px){.q{grid-template-columns:1fr}}
.ladder{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;align-items:end;margin:22px 0 10px}
.rung{border-radius:10px 10px 4px 4px;background:var(--surface-2);border:1px solid var(--line);display:flex;flex-direction:column;justify-content:flex-end;padding:8px 6px;min-height:40px;position:relative}
.rung b{font-family:var(--f-num);font-weight:800;font-size:13px;color:var(--mute)}
.rung span{font-size:12px;font-weight:700;color:var(--mute);line-height:1.3}
.rung.on{background:var(--accent);border-color:var(--accent)}
.rung.on b,.rung.on span{color:var(--accent-ink)}
.rung.on .flag{color:var(--accent)}
.rung.target{border:2px dashed var(--accent)}
.rung .flag{position:absolute;top:-24px;left:-12px;right:-12px;text-align:center;font-size:11px;font-weight:700;color:var(--accent);white-space:nowrap}
.result{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 22px;align-items:center;border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;background:var(--bg);margin-top:14px}
.result .big{font-family:var(--f-num);font-weight:800;font-size:64px;line-height:1;color:var(--accent)}
.result .big small{font-size:20px;margin-right:2px}
.result h4{margin:0;font-size:20px}
.result p{margin:2px 0 0;color:var(--mute)}
.result p b{color:var(--fg)}
.lvlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin-top:10px}
.lv{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--bg)}
.lv b{font-family:var(--f-num);color:var(--accent);font-size:13px;letter-spacing:.06em}
.lv h4{margin:2px 0 4px;font-size:16px}
.lv p{margin:0;font-size:14px;color:var(--mute);line-height:1.65}

/* ステップ2: AI比較 */
.tools{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:16px}
.tool{border:1px solid var(--line);border-radius:var(--r);padding:18px 18px 16px;background:var(--bg);display:flex;flex-direction:column;gap:8px}
.tool.main{border-color:var(--accent)}
.tool-top{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.tool .tag{align-self:flex-start}
.tool h4{margin:0;font-family:var(--f-num);font-weight:800;font-size:24px;letter-spacing:-.01em}
.tool .maker{font-size:13px;color:var(--mute)}
.tag{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:2px 10px;background:var(--accent-soft);color:var(--accent)}
.tool dl{margin:0;display:grid;grid-template-columns:5.5em minmax(0,1fr);gap:4px 10px;font-size:14px}
.tool dt{color:var(--mute);font-weight:700}
.tool dd{margin:0}
@media (max-width:700px){.tools{grid-template-columns:1fr}}
.rules3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:6px}
.rule{border-top:3px solid var(--accent);padding:14px 2px 0}
.rule .num{font-weight:800;color:var(--accent);font-size:13px}
.rule h4{margin:2px 0 6px;font-size:17px;line-height:1.5}
.rule p{margin:0;font-size:14px;color:var(--mute)}
@media (max-width:700px){.rules3{grid-template-columns:1fr}}

/* ステップ3: 手順 */
.checks{list-style:none;margin:16px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.check{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:var(--bg)}
.check input{appearance:none;-webkit-appearance:none;width:26px;height:26px;border:2px solid var(--mute);border-radius:50%;margin:2px 0 0;cursor:pointer;display:grid;place-items:center}
.check input:checked{background:var(--ok);border-color:var(--ok)}
.check input:checked::after{content:"〇";font-size:13px;font-weight:700;color:#06150f;line-height:1}
.check h4{margin:0 0 2px;font-size:16px}
.check p{margin:0;font-size:14.5px;color:var(--mute)}
.check p b{color:var(--fg)}
.check.is-on h4{color:var(--ok)}
.path{display:inline;font-weight:700;color:var(--fg);background:var(--surface-2);border-radius:6px;padding:1px 6px}
.callout{border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:var(--surface-2);font-size:14.5px;margin-top:16px}
.callout b{color:var(--accent)}
.callout p{margin:0 0 6px}
.callout p:last-child{margin:0}

/* ステップ4: ルール */
.trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:16px 0 4px}
.trio > div{border:1px solid var(--line);border-radius:var(--r);padding:16px;background:var(--bg)}
.trio h4{margin:0 0 8px;font-size:17px;display:flex;align-items:center;gap:8px}
.trio h4 .mk{font-family:var(--f-display);font-size:22px;line-height:1}
.trio ul{margin:0;padding-left:1.1em;font-size:14.5px;color:var(--mute)}
.trio li{margin-bottom:3px}
.mk-ng{color:var(--ng)}.mk-ok{color:var(--ok)}.mk-ac{color:var(--accent)}
@media (max-width:760px){.trio{grid-template-columns:1fr}}
.quiz{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.qz{border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:var(--bg)}
.qz-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 16px;align-items:center}
.qz-q{font-weight:500}
.qz-q .num{color:var(--mute);font-size:13px;font-weight:700;margin-right:8px}
.ox{display:flex;gap:6px}
.ox button{width:52px;height:44px;border-radius:10px;border:1px solid var(--line);background:transparent;cursor:pointer;font-family:var(--f-display);font-size:22px;color:var(--mute);line-height:1}
.ox button:hover{border-color:var(--mute)}
.qz.answered .ox button{cursor:default}
.ox button.pick-right{background:var(--ok);border-color:var(--ok);color:#06150f}
.ox button.pick-wrong{background:var(--ng);border-color:var(--ng);color:#1a0705}
.ox button.is-answer{border:2px solid var(--ok);color:var(--ok)}
.qz-a{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);font-size:14.5px;color:var(--mute)}
.qz-a b.right{color:var(--ok)}.qz-a b.wrong{color:var(--ng)}
@media (max-width:560px){.qz-row{grid-template-columns:1fr}}
.score{display:flex;align-items:baseline;gap:10px;margin:14px 0 0;font-weight:700}
.score .num{font-size:34px;color:var(--accent);font-weight:800}

/* ステップ5: 指示文 */
.tips{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:14px 0 6px}
.tips div{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:14px;color:var(--mute)}
.tips b{display:block;color:var(--fg);font-size:15px;margin-bottom:2px}
@media (max-width:760px){.tips{grid-template-columns:1fr}}
.pgroup{display:flex;align-items:center;gap:10px;margin:30px 0 10px;flex-wrap:wrap}
.pgroup h3{margin:0}
.pgroup .count{font-size:13px;color:var(--mute)}
.prompts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:980px){.prompts{grid-template-columns:1fr}}
.pcard{border:1px solid var(--line);border-radius:var(--r);background:var(--bg);display:flex;flex-direction:column;min-width:0}
.pcard-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;padding:14px 16px 8px}
.pcard h4{margin:0;font-size:16.5px;line-height:1.5}
.pcard .scene{margin:2px 0 0;font-size:13px;color:var(--mute)}
.pcard pre{margin:0 16px;padding:12px 14px;background:var(--surface-2);border-radius:10px;white-space:pre-wrap;word-break:break-word;font-family:var(--f-body);font-size:13.5px;line-height:1.75;max-height:260px;overflow:auto;color:#e2e0d8}
.ph{background:var(--accent-soft);color:var(--accent);border-radius:4px;padding:0 2px}
.caution{margin:10px 16px 0;font-size:13px;color:var(--ng);display:flex;gap:6px}
.pcard-foot{padding:12px 16px 14px;margin-top:auto}

/* ステップ6: 仕事の書き出し */
.sum{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:12px;margin:16px 0}
.sum-main{border:1px solid var(--accent);border-radius:var(--r);padding:18px 20px;background:var(--bg)}
.sum-main .lbl{font-size:13px;font-weight:700;color:var(--mute);letter-spacing:.08em}
.sum-main .big{font-family:var(--f-num);font-weight:800;font-size:clamp(48px,6vw,72px);line-height:1.05;color:var(--accent);letter-spacing:-.03em}
.sum-main .big small{font-family:var(--f-body);font-size:18px;color:var(--fg);margin-left:4px;letter-spacing:0}
.sum-main p{margin:4px 0 0;color:var(--mute);font-size:14px}
.sum-main p b{color:var(--fg)}
.meter{margin-top:12px}
.meter-bar{height:10px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.meter-bar span{display:block;height:100%;background:var(--accent)}
.meter-cap{display:flex;justify-content:space-between;font-size:12px;color:var(--mute);margin-top:4px}

var toastTimer = null;
function toast(msg){
  var el = $('#toast'); el.textContent = msg; el.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(function(){ el.classList.remove('show'); }, 2600);
}
function copyText(text, selectEl){
  var prevFocus = document.activeElement;
  function back(){ try{ if(prevFocus && prevFocus.focus) prevFocus.focus({preventScroll:true}); }catch(e){} }
  function fallback(){
    var ok = false;
    try{
      var ta = document.createElement('textarea');
      ta.value = text; ta.setAttribute('readonly', '');
      ta.style.cssText = 'position:fixed;top:0;left:0;width:1px;height:1px;opacity:0;';
      document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, text.length);
      ok = document.execCommand && document.execCommand('copy');
      document.body.removeChild(ta);
    }catch(e){ ok = false; }
    back();
    if(ok){ toast('コピーしました。AIの入力欄に貼り付けてください'); return; }
    if(selectEl){ try{ var r = document.createRange(); r.selectNodeContents(selectEl); var s = window.getSelection(); s.removeAllRanges(); s.addRange(r); }catch(e){} }
    toast('自動でコピーできませんでした。選ばれた文字を長押し（右クリック）してコピーしてください');
  }
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(function(){ toast('コピーしました。AIの入力欄に貼り付けてください'); }, fallback);
    } else { fallback(); }
  }catch(e){ fallback(); }
}

function exampleTasks(id){

function ensureTasks(){ if(!Array.isArray(S.tasks)) S.tasks = exampleTasks(S.industry); }
function typeOf(id){ for(var i=0;i<TASK_TYPES.length;i++){ if(TASK_TYPES[i].id === id) return TASK_TYPES[i]; } return TASK_TYPES[0]; }
function freqOf(id){ for(var i=0;i<FREQS.length;i++){ if(FREQS[i].id === id) return FREQS[i]; } return FREQS[0]; }
function calcRow(t){
  var c = Math.max(0, Number(t.count) || 0), m = Math.max(0, Number(t.min) || 0);
  var month = c * freqOf(t.freq).mult * m;
  return {month: month, saved: month * typeOf(t.type).rate};
}

function updateTaskCalc(){
  if(!Array.isArray(S.tasks)) return;
  var calc = S.tasks.map(function(t, i){ var c = calcRow(t); c.i = i; return c; });
  var order = calc.filter(function(c){ return c.saved > 0; }).sort(function(a, b){ return b.saved - a.saved; });
  var rank = {}; order.forEach(function(c, k){ rank[c.i] = k + 1; });
  calc.forEach(function(c){
    var m = $('[data-out="month-' + c.i + '"]'), s = $('[data-out="saved-' + c.i + '"]'), r = $('[data-out="rank-' + c.i + '"]');
    if(m) m.textContent = fmtNum(c.month / 60, 1) + ' 時間';
    if(s) s.textContent = c.saved > 0 ? fmtNum(c.saved / 60, 1) + ' 時間' : '―';
    if(r){ var k = rank[c.i]; r.textContent = k ? k : '―'; r.className = 'rank' + (k && k <= 3 ? ' r' + k : ''); }
  });
  var totalSaved = order.reduce(function(a, c){ return a + c.saved; }, 0);
  var perDay = totalSaved / 25;
  var goal = Math.max(1, Number(S.goalMin) || 60);
  var pct = Math.min(100, perDay / goal * 100);
  var top = order.slice(0, 3).map(function(c, k){
    var name = S.tasks[c.i].name || '（名前なし）';
    return '<li><span class="num">' + (k+1) + '</span><span>' + esc(name) + '</span><span class="v">月 ' + fmtNum(c.saved / 60, 1) + ' 時間</span></li>';
  }).join('');
  var box = $('#task-sum');
  if(!box) return;
  box.innerHTML =
    '<div class="sum-main"><div class="lbl">AIで減る時間（お店全体の見込み）</div>' +

function today(){ var d = new Date(); var m = d.getMonth() + 1, dd = d.getDate(); return d.getFullYear() + '-' + (m < 10 ? '0' : '') + m + '-' + (dd < 10 ? '0' : '') + dd; }

function updateKpi(){
  var el = $('#kpi-res'); if(!el) return;
  var a = Number(S.kpi.staff) || 0, b = Number(S.kpi.active) || 0;
  if(a > 0 && b > a){ el.innerHTML = '「今週使った人」が、スタッフ全員の人数より多くなっています'; }
  else if(a > 0){ var p = b / a * 100; el.innerHTML = '活用率 <b>' + fmtNum(p, 0) + '%</b>' + (p >= 80 ? '目標に届いています' : '目標の80%まで あと' + Math.max(0, Math.ceil(a * 0.8 - 1e-9) - b) + '人'); }
  else el.innerHTML = '人数を入れると、活用率が出ます';
}

function ruleText(){
  var R = S.rules;
  var tools = RULE_TOOLS.filter(function(t){ return R.tools[t[0]]; }).map(function(t){ return t[1]; });
  var n = 0; function h(t){ n++; return '\n' + n + '. ' + t + '\n'; }
  var s = '【' + (R.shop || '（店名）') + '　AI利用ルール】\n';
  s += '始める日：' + (R.date || '（日付）') + '　　AI担当：' + (R.lead || '（担当者）') + '\n';
  s += h('使ってよいAI');
  s += tools.length ? '・' + tools.join('、') + '（お店で決めたアカウントで使う）\n' : '・（使ってよいAIを選んでください）\n';
  s += '・ここにないAIや、よく知らない会社のAIアプリは使わない\n';
  s += h('AIに入れない情報');
  s += '・お客様個人のことが分かる情報（名前・電話番号・住所・メールアドレス・カルテ・顧客メモ）\n・パスワード・カード番号・口座番号\n・取引先との秘密の約束（契約書の中身など）\n※売上や客数など、お客様個人が分からないお店の数字は入れてかまいません（学習オフにした、お店のAIに限る）\n';
  if(R.sec.connect){
    s += h('AIとつないでよいサービス');
    s += '・Gmail・Googleドライブ・予約システムなどとAIをつなぐ機能（連携・コネクタ・拡張機能）は、AI担当の許可を取ってから使う\n';
    var con = String(R.connect || '').split('\n').map(function(x){ return x.trim(); }).filter(Boolean);
    if(con.length) s += '・つないでよいもの：' + con.join('、') + '\n';
  }
  if(R.sec.check){ s += h('出す前に人が確かめること'); s += '・料金・営業時間・場所・法律などの「事実」は、必ず確かめる\n・「必ず」「絶対」「治る」など、言い過ぎの言葉を直す\n・他の人の写真や文章を、そのまま使わない\n'; }
  if(R.sec.account){ s += h('アカウントの守り'); s += '・会話を学習に使わない設定にする（回答の「良い・良くない」ボタンは押さない）\n・2段階認証をオンにする\n・アカウントを人と共有しない。お店で管理しているメールアドレスで登録する\n・辞めた人のアカウントはすぐ止める（チーム向けプランなら管理者が外す。個人で登録したものは本人に削除してもらう）\n'; }
  if(R.sec.trouble){ s += h('困ったとき・入れてしまったとき'); s += '・入れてはいけない情報を入れてしまったら、すぐAI担当に伝える（責めません。早く分かれば対処できます）\n・使ってよいか迷ったら、使う前にAI担当に聞く\n'; }
  var extra = String(R.extra || '').split('\n').map(function(x){ return x.trim(); }).filter(Boolean);
  if(extra.length){ s += h('お店だけのルール'); s += extra.map(function(x){ return '・' + x; }).join('\n') + '\n'; }
  if(R.sec.review){ s += h('ルールの見直し'); s += '・このルールは月に1回、AI担当が見直す\n・AIの使い方が変わったら、その都度みんなに知らせる\n'; }
  return s;
}
function updateRuleOut(){ var el = $('#rule-out'); if(el) el.textContent = ruleText(); }
function hearingText(){
  var out = '【AI導入　初回の聞き取り】\n';
  HEARING.forEach(function(s){
    out += '\n■ ' + s.sec + '\n';
    s.f.forEach(function(f){ out += '・' + f[1] + '：' + ((String(S.hearing[f[0]] || '').trim() || '（未記入）').replace(/\n/g, '\n　　')) + '\n'; });
  });
  return out;
}

/* ───────── 画面の切り替え ───────── */
var staffRendered = false;
function setMode(mode){
  if(window.NAVI_CLIENT_ONLY) mode = 'client';
  $('#view-client').hidden = mode !== 'client';
  $('#view-staff').hidden = mode !== 'staff';
  if(mode === 'staff' && !staffRendered){ renderStaff(); staffRendered = true; }
  $all('.modes a').forEach(function(a){ if(a.getAttribute('data-mode') === mode) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
}
function route(){ setMode(location.hash === '#staff' ? 'staff' : 'client'); }
function scrollPanelIntoView(){
  var p = $('#panel'); if(!p) return;
  var top = p.getBoundingClientRect().top;
  if(top < 70 || top > window.innerHeight * 0.6){
    var y = window.pageYOffset + top - 84;
    try{ window.scrollTo({top:y, behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth'}); }catch(e){ window.scrollTo(0, y); }
  }
}

/* ───────── 操作 ───────── */
document.addEventListener('click', function(e){
  var link = e.target.closest('.modes a, a.brand');
  if(link){
    e.preventDefault();
    var m = link.getAttribute('data-mode') || 'client';
    setMode(m); window.scrollTo(0, 0);
    try{ if(location.hash !== '#' + m) location.hash = m; }catch(err){}
    return;
  }
  var b = e.target.closest('[data-act]'); if(!b) return;
  var act = b.getAttribute('data-act');
  var i = Number(b.getAttribute('data-i'));
  switch(act){
    case 'industry':
      S.industry = b.getAttribute('data-id');
      if(Array.isArray(S.tasks) && S.tasks.every(function(t){ return t.ex; })) S.tasks = exampleTasks(S.industry);
      save(); renderChips(); renderPanel(); break;
    case 'ai':
      S.ai = b.getAttribute('data-id'); save(); renderChips(); renderPanel(); break;
    case 'goto':
      S.step = i; save(); renderStepper(); renderPanel(); scrollPanelIntoView(); break;
    case 'prev':
      if(S.step > 0){ S.step--; save(); renderStepper(); renderPanel(); scrollPanelIntoView(); } break;
    case 'next':
      S.done[S.step] = true;
      if(S.step < 6){ S.step++; save(); renderStepper(); renderPanel(); scrollPanelIntoView(); }
      else { save(); renderStepper(); renderPanel(); toast(doneCount() === 7 ? '7つのステップがすべて完了しました' : '完了にしました。残りのステップも進めましょう'); }
      break;
    case 'lv':
      S.level[i] = b.getAttribute('data-v') === '1'; save(); renderPanel(); break;
    case 'quiz':
      if(S.quiz[i] === true || S.quiz[i] === false) break;
      S.quiz[i] = b.getAttribute('data-v') === '1'; save(); renderPanel(); break;
    case 'quiz-reset':
      S.quiz = {}; save(); renderPanel(); break;
    case 'copy-first':
      copyText(fill(FIRST_PROMPT), $('#first-prompt')); break;
    case 'copy-prompt':
      var idx = Number(b.getAttribute('data-idx')); var p = promptIndex[idx];
      if(p) copyText(fill(p.p), $('#pp-' + idx)); break;
    case 'task-add':
      ensureTasks(); S.tasks.push({name:'', type:'write', freq:'week', count:1, min:10, ex:false}); save(); renderPanel();
      var inp = $('#task-' + (S.tasks.length - 1) + '-name'); if(inp) inp.focus(); break;
    case 'task-del':
      ensureTasks(); S.tasks.splice(i, 1); save(); renderPanel(); break;
    case 'task-clear-ex':
      ensureTasks(); S.tasks = S.tasks.filter(function(t){ return !t.ex; });
      if(!S.tasks.length) S.tasks.push({name:'', type:'write', freq:'week', count:1, min:10, ex:false});
      save(); renderPanel(); break;
    case 'task-reset':
      S.tasks = exampleTasks(S.industry); save(); renderPanel(); break;
    case 'wk-reset':
      S.weekly = {}; save(); renderPanel(); toast('チェックを外しました。今週もよろしくお願いします'); break;
    case 'log-add':
      var d = $('#log-date').value || today(), m = Math.round(Number($('#log-min').value)), memo = $('#log-memo').value.trim();
      if(!(m > 0)){ toast('減った時間を、分で入れてください'); $('#log-min').focus(); break; }
      S.log.push({date:d, min:m, memo:memo}); save(); renderPanel(); toast('記録しました'); break;
    case 'log-del':
      S.log.splice(i, 1); save(); renderPanel(); break;
    case 'jump':
      var t = document.getElementById(b.getAttribute('data-to')); if(t) t.scrollIntoView({behavior:'smooth', block:'start'}); break;
    case 'hear-copy':
      var txt = hearingText(); var out = $('#hear-out'); out.textContent = txt; out.hidden = false; copyText(txt, out); break;
    case 'hear-clear':
      S.hearing = {}; save(); $all('[data-hear]').forEach(function(el){ el.value = ''; }); var ho = $('#hear-out'); if(ho) ho.hidden = true; toast('聞き取りを空にしました'); break;
    case 'rule-copy':
      copyText(ruleText(), $('#rule-out')); break;
    case 'reset-ask':
      $('#reset-box').innerHTML = '<span>このブラウザに保存した入力をすべて消します。元に戻せません。</span><button type="button" class="btn btn-sm btn-danger" data-act="reset-do">消す</button><button type="button" class="btn btn-sm" data-act="reset-cancel">やめる</button>'; break;
    case 'reset-cancel':
      $('#reset-box').innerHTML = '<button type="button" class="btn btn-sm" data-act="reset-ask">入力をすべて消す</button>'; break;
    case 'reset-do':
      try{ localStorage.removeItem(KEY); }catch(err){}
      S = defaults(); staffRendered = false;
      $('#reset-box').innerHTML = '<button type="button" class="btn btn-sm" data-act="reset-ask">入力をすべて消す</button>';
      renderClientShell(); route(); toast('入力をすべて消しました'); break;
  }
});

document.addEventListener('input', function(e){
  var el = e.target;
  if(el.hasAttribute('data-task')){
    var i = Number(el.getAttribute('data-task')), k = el.getAttribute('data-k');
    if(!S.tasks || !S.tasks[i]) return;
    S.tasks[i][k] = el.value;
    S.tasks[i].ex = false;
    var row = el.closest('tr'); if(row) row.classList.remove('is-ex');
    save(); updateTaskCalc(); return;
  }
  if(el.id === 'task-goal'){
    var gv = el.value.trim(), gn = Number(gv), ge = $('#goal-err');
    if(gv === ''){ if(ge) ge.hidden = true; return; }
    if(!(gn >= 1)){ if(ge) ge.hidden = false; return; }
    if(ge) ge.hidden = true;
    S.goalMin = Math.round(gn); save(); updateTaskCalc(); return;
  }
  if(el.hasAttribute('data-hear')){ S.hearing[el.getAttribute('data-hear')] = el.value; save(); return; }
  if(el.hasAttribute('data-rule')){ S.rules[el.getAttribute('data-rule')] = el.value; save(); updateRuleOut(); return; }
  if(el.id === 'kpi-staff' || el.id === 'kpi-active'){ S.kpi[el.id === 'kpi-staff' ? 'staff' : 'active'] = el.value; save(); updateKpi(); return; }
});

document.addEventListener('change', function(e){
  var el = e.target;
  if(el.getAttribute('data-act') === 'setup'){
    S.setup[el.getAttribute('data-key')] = el.checked; save();
    var li = el.closest('.check'); if(li) li.classList.toggle('is-on', el.checked); return;
  }
  if(el.getAttribute('data-act') === 'wk'){ S.weekly[el.getAttribute('data-i')] = el.checked; save(); return; }
  if(el.hasAttribute('data-rtool')){ S.rules.tools[el.getAttribute('data-rtool')] = el.checked; save(); updateRuleOut(); return; }
  if(el.hasAttribute('data-rsec')){ S.rules.sec[el.getAttribute('data-rsec')] = el.checked; save(); updateRuleOut(); return; }
  if(el.hasAttribute('data-prep')){ S.prep[el.getAttribute('data-prep')] = el.checked; save(); return; }
});

document.addEventListener('keydown', function(e){
  if(e.key === 'Enter' && (e.target.id === 'log-min' || e.target.id === 'log-memo')){ e.preventDefault(); var b = document.querySelector('[data-act="log-add"]'); if(b) b.click(); }
});

window.addEventListener('hashchange', function(){ route(); window.scrollTo(0, 0); });

if(window.NAVI_CLIENT_ONLY){ var modeNav = $('.modes'); if(modeNav) modeNav.remove(); }
renderClientShell();
route();
})();
</script>
</body>
</html>
